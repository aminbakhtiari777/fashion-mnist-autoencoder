[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-vision-lab"
version = "1.0.0"
description = "Shared models and evaluation for Fashion-MNIST vision experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
train = ["matplotlib>=3.9,<4", "tensorflow>=2.17,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
